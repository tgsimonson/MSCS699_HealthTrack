          title: Steps
        active_minutes:
          type: integer
          title: Active Minutes
        sedentary_minutes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sedentary Minutes
        resting_hr:
          anyOf:
          - type: integer
          - type: 'null'
          title: Resting Hr
