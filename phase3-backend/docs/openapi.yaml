  /api/v1/patients/{patient_id}/care-team:
    get:
      tags:
      - Patients
      summary: Current care team
      description: '**Roles:** patient (self), clinician and physician (care team), admin.'
      operationId: care_team_api_v1_patients__patient_id__care_team_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Patient Id
