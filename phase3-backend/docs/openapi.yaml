            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - Patients
      summary: Withdraw and soft-delete a patient
      description: '**Roles:** admin. Sets `program_status` to withdrawn and hides the record. Clinical history is retained
        for the medical record.'
      operationId: delete_patient_api_v1_patients__patient_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Patient Id
      responses:
        '204':
