          type: string
          format: uuid
          title: User Id
        team_role:
          $ref: '#/components/schemas/CareTeamRole'
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End Date
      additionalProperties: false
      type: object
      required:
