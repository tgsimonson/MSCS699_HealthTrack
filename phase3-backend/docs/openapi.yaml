components:
  schemas:
    ActivitySummary:
      properties:
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        days_reported:
          type: integer
          title: Days Reported
        days_in_range:
          type: integer
          title: Days In Range
        total_steps:
          type: integer
          title: Total Steps
        avg_steps:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Steps
        total_active_minutes:
          type: integer
          title: Total Active Minutes
        avg_active_minutes:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Active Minutes
        avg_resting_hr:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Resting Hr
      additionalProperties: false
      type: object
      required:
      - start_date
      - end_date
      - days_reported
      - days_in_range
      - total_steps
      - avg_steps
      - total_active_minutes
      - avg_active_minutes
      - avg_resting_hr
      title: ActivitySummary
    Body_login_api_v1_auth_token_post:
      properties:
        username:
          type: string
          title: Username
          description: Account email
          examples:
          - marcus.lee@healthtrack.example
        password:
          type: string
          title: Password
          examples:
          - HealthTrack-Demo-2026!
        grant_type:
          type: string
          pattern: ^password$
          title: Grant Type
          default: password
        mfa_code:
          anyOf:
          - type: string
            pattern: ^\d{6}$
          - type: 'null'
          title: Mfa Code
      type: object
      required:
      - username
      - password
      title: Body_login_api_v1_auth_token_post
    CareTeamMemberOut:
