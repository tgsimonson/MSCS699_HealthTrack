openapi: 3.1.0
info:
  title: HealthTrack API
  description: "Backend for **HealthTrack**, remote monitoring for home-based cardiac rehabilitation. Phase 3 delivered patients,\n\
    vital signs, daily activity, and devices with JWT authentication and care-team authorization. **Phase 4 adds the\nreal-time\
    \ alert system:** every reading is checked against patient-specific thresholds, trend rules watch activity\npatterns,\
    \ alerts are prioritized and deduplicated, notifications go out on the dashboard, email, and SMS, unanswered\nalerts escalate,\
    \ and new readings and alerts are pushed to dashboards over a WebSocket. All data is synthetic.\n\n## Quick start\n\n\
    1. **Authorize:** click **Authorize**, enter `marcus.lee@healthtrack.example` / `HealthTrack-Demo-2026!`\n   (seed data),\
    \ and submit. Swagger UI sends the token on every request after that.\n2. Call `GET /api/v1/patients` to see the patients\
    \ on that clinician's care team.\n3. Pick a `patient_id` and try `GET /api/v1/patients/{patient_id}/vitals/daily-summary`.\n\
    4. Call `GET /api/v1/alerts` for the active alert worklist, then `GET /api/v1/alerts/{alert_id}` for its history.\n\n\
    ## Alert workflow\n\n1. A device posts a reading (`POST /patients/{id}/vitals` or `/vitals/batch`). It is stored first,\
    \ then checked\n   against the threshold rules. The threshold for each rule comes from a patient override, else the exercise\n\
    \   prescription, else the program default (`GET /patients/{id}/alert-thresholds` shows which).\n2. A breach creates an\
    \ alert, or folds into the open alert for the same condition. Non-critical alerts inside a\n   rule's suppression window,\
    \ or masked by a more severe alert on the same measurement, are stored as `suppressed`.\n   Critical alerts are never\
    \ suppressed.\n3. Notifications are queued per the severity's escalation policy (critical: dashboard, SMS, email) and\
    \ sent at once;\n   low severity email waits for the morning digest.\n4. A clinician acknowledges (`POST /alerts/{id}/acknowledge`)\
    \ and resolves with a note (`POST /alerts/{id}/resolve`).\n   An alert nobody acknowledges escalates (critical: supervising\
    \ physician at 15 minutes, whole care team at 30).\n5. Trend rules (missed sessions, zone minutes, resting heart rate,\
    \ steps, data gaps) run every 15 minutes and when a\n   day of activity is uploaded.\n\n## Live stream\n\n`POST /stream/ticket`\
    \ returns a one-time ticket. Open `ws://<host>/api/v1/stream`, send\n`{\"type\": \"auth\", \"ticket\": \"...\"}`, and\
    \ receive `vital`, `alert`, `activity`, and `notification` events for the\npatients on your care team. See the **Live\
    \ Stream** tag for the full protocol.\n\n## Authentication\n\n* `POST /api/v1/auth/token` (form-encoded `username`, `password`,\
    \ optional `mfa_code`) returns a 15-minute JWT\n  access token and an opaque refresh token. Send the access token as `Authorization:\
    \ Bearer <token>`.\n* `POST /api/v1/auth/refresh` rotates the refresh token. Reusing an already-rotated token revokes\
    \ every session.\n* `POST /api/v1/auth/logout` revokes the session; its access tokens stop working immediately.\n* Five\
    \ failed logins lock an account for 15 minutes (`423`). Login is rate limited per IP and per account (`429`).\n\n## Authorization\n\
    \n| Resource | patient | clinician / physician | admin | it_admin |\n|---|---|---|---|---|\n| Patient record | read own,\
    \ edit contact fields | read and edit care team patients | read, edit, soft-delete all | none |\n| Vital signs, activity,\
    \ devices | read and upload own | read, record, correct for care team | none | none |\n| Patient list and search | none\
    \ | care team only | all (demographics) | none |\n| Alerts: worklist, history, acknowledge, resolve | none | care team\
    \ only | metrics only | none |\n| Alert rules | none | read (physician: change) | read | none |\n| Escalation policies\
    \ | none | read (physician: change) | read and change | none |\n| Prescription and patient thresholds | read own prescription\
    \ | care team (prescription: physician) | none | none |\n| Live stream and worklist | none | care team only | none | none\
    \ |\n\nA request for a patient outside the caller's scope returns **404**, not 403, so the API never confirms that a record\n\
    exists. Every read and write of patient data is recorded in the audit log.\n\n## Errors\n\nEvery error uses [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457)\
    \ problem details (`application/problem+json`)\nwith a `request_id` that also appears in the server log and the `X-Request-ID`\
    \ response header.\n\n| Status | Meaning |\n|---|---|\n| 400 | Malformed request |\n| 401 | Missing, expired, or revoked\
    \ token; bad credentials |\n| 403 | Your role cannot perform this action |\n| 404 | Not found, or outside your scope |\n\
    | 409 | Conflict with existing data (duplicate MRN, duplicate `idempotency_key`, care team role taken) |\n| 422 | Validation\
    \ failed; `errors` lists each field |\n| 423 | Account locked after repeated failed logins |\n| 429 | Rate limited; see\
    \ `Retry-After` |\n| 503 | Database unavailable; safe to retry |\n"
  version: 0.4.0
servers:
- url: http://localhost:8000
  description: Local development
paths:
  /api/v1/auth/token:
    post:
      tags:
      - Auth
      summary: Log in and receive tokens
      description: OAuth2 password grant (form-encoded). Accounts with MFA enabled must send a 6-digit `mfa_code`. Five failed
        attempts lock the account for 15 minutes. Errors never reveal whether an email exists. Rate limited per client IP
        and per account.
      operationId: login_api_v1_auth_token_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_v1_auth_token_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: missing bearer token
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/validation_error
                title: Validation Error
                status: 422
                detail: One or more fields are invalid.
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
                errors:
                - field: systolic_bp
                  message: must be greater than diastolic_bp
                  code: value_error
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: Account locked
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/locked
                title: Locked
                status: 423
                detail: account temporarily locked after repeated failed logins
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/too_many_requests
                title: Too Many Requests
                status: 429
                detail: too many login attempts; try again later
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate the refresh token
      description: Exchanges a valid refresh token for a new pair and revokes the old one. Presenting a token that was already
        rotated revokes every session for the account (theft detection).
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: missing bearer token
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/validation_error
                title: Validation Error
                status: 422
                detail: One or more fields are invalid.
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
                errors:
                - field: systolic_bp
                  message: must be greater than diastolic_bp
                  code: value_error
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke the current session
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: missing bearer token
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Current user profile
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: missing bearer token
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/patients:
    get:
      tags:
      - Patients
      summary: List patients in scope
      description: '**Roles:** clinician and physician (their current care team), admin (all, demographics only). Patients
        use `GET /patients/{patient_id}` for their own record.'
      operationId: list_patients_api_v1_patients_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: program_status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/ProgramStatus'
          - type: 'null'
          title: Program Status
      - name: clinician_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Primary clinician user id
          title: Clinician Id
        description: Primary clinician user id
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^-?(last_name|enrollment_date|created_at)$
          default: last_name
          title: Sort
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_PatientSummary_'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: missing bearer token
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed for this action
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/forbidden
                title: Forbidden
                status: 403
                detail: role admin cannot access this resource
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Patients
      summary: Register a patient
      description: '**Roles:** admin, clinician, physician. Creates the patient plus the primary clinician and supervising
        physician care team assignments in one transaction.'
      operationId: create_patient_api_v1_patients_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOut'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: missing bearer token
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed for this action
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/forbidden
                title: Forbidden
                status: 403
                detail: role admin cannot access this resource
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflicts with existing data
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/conflict
                title: Conflict
                status: 409
                detail: a patient with this MRN already exists
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/validation_error
                title: Validation Error
                status: 422
                detail: One or more fields are invalid.
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
                errors:
                - field: systolic_bp
                  message: must be greater than diastolic_bp
                  code: value_error
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/patients/search:
    post:
      tags:
      - Patients
      summary: Search patients by name or MRN
      description: '**Roles:** clinician, physician, admin. Terms travel in the body so names never appear in URLs or access
        logs. Results are scoped like `GET /patients`.'
      operationId: search_patients_api_v1_patients_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientSearch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_PatientSummary_'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: missing bearer token
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed for this action
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/forbidden
                title: Forbidden
                status: 403
                detail: role admin cannot access this resource
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/validation_error
                title: Validation Error
                status: 422
                detail: One or more fields are invalid.
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
                errors:
                - field: systolic_bp
                  message: must be greater than diastolic_bp
                  code: value_error
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/patients/{patient_id}:
    get:
      tags:
      - Patients
      summary: Get a patient
      description: '**Roles:** patient (self), clinician and physician (care team), admin.'
      operationId: get_patient_api_v1_patients__patient_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Patient Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOut'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: missing bearer token
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed for this action
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/forbidden
                title: Forbidden
                status: 403
                detail: role admin cannot access this resource
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found, or outside the caller's scope
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/not_found
                title: Not Found
                status: 404
                detail: patient not found
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Patients
      summary: Update a patient
      description: '**Roles:** clinician and physician (care team), admin; patients may change only `phone`, `email`, and
        `postal_code` on their own record. The audit log stores the names of changed columns, never their values.'
      operationId: update_patient_api_v1_patients__patient_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Patient Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOut'
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: missing bearer token
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed for this action
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/forbidden
                title: Forbidden
                status: 403
                detail: role admin cannot access this resource
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found, or outside the caller's scope
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/not_found
                title: Not Found
                status: 404
                detail: patient not found
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflicts with existing data
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/conflict
                title: Conflict
                status: 409
                detail: a patient with this MRN already exists
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Request failed validation
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/validation_error
                title: Validation Error
                status: 422
                detail: One or more fields are invalid.
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
                errors:
                - field: systolic_bp
                  message: must be greater than diastolic_bp
                  code: value_error
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
      - Patients
      summary: Withdraw and soft-delete a patient
      description: '**Roles:** admin. Sets `program_status` to withdrawn and hides the record. Clinical history is retained
        for the medical record.'
      operationId: delete_patient_api_v1_patients__patient_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Patient Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing, expired, or invalid access token
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: missing bearer token
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role not allowed for this action
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/forbidden
                title: Forbidden
                status: 403
                detail: role admin cannot access this resource
                request_id: 2b8f0a5e-6d2c-4f7e-9a1b-3c4d5e6f7a8b
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found, or outside the caller's scope
          content:
            application/problem+json:
              example:
                type: https://api.healthtrack.example/problems/not_found
                title: Not Found
